# Company names and sector words used to GROUND the tickers a model proposes for a free-text question
# (harness/intent.py::mentioned_tickers / mentioned_groups). Matching is case-insensitive on Turkish-folded text
# (ı→i, ğ→g, ü→u, ş→s, ö→o, ç→c), so "eregli" matches "Ereğli". Aliases of 4 characters or fewer must be a whole
# token (an apostrophe suffix such as THY'de is allowed), longer ones may carry a Turkish suffix (Aselsan'ın,
# aselsanın). Longer aliases are matched first ("aksa enerji" before "aksa").
# Ambiguous everyday words are only listed in a longer, unambiguous form: "garanti bankası" (not "garanti"),
# "şok market" (not "şok"), "mavi giyim" (not "mavi"), "logo yazılım" (not "logo"), "deva holding" (not "deva").
# Lower-case ticker codes count as a mention too, except the codes that are everyday words (lowercase_code_excluded).
lowercase_code_excluded: [MAVI, LOGO, DEVA, BERA, SISE]   # sise = şişe (bottle)

