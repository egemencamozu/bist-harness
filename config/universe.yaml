  SASA: Chemicals / Plastics
  TRALT: Mining
  FROTO: Automotive
  ENKAI: Construction
  PGSUS: Transportation / Airlines
  MPARK: Healthcare
  EKGYO: Real Estate Investment Trust
  GUBRF: Chemicals / Fertilizer
  TURSG: Insurance
  ENJSA: Electric Utilities
  TTKOM: Telecommunications
  OYAKC: Cement
  AKSEN: Electric Utilities
  ISMEN: Brokerage / Capital Markets
  ARCLK: Durables / Machinery
  ECILC: Healthcare / Pharmaceuticals
  MAVI: Retail / Apparel
  PETKM: Petrochemicals
  TOASO: Automotive
