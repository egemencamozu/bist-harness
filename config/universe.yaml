universes:
  course_30:
    tickers: [ASELS, TUPRS, BIMAS, THYAO, AKBNK, KCHOL, EREGL, TCELL, CCOLA, MGROS,
              SASA, TRALT, FROTO, ENKAI, PGSUS, MPARK, EKGYO, GUBRF, TURSG, ENJSA,
              TTKOM, OYAKC, AKSEN, ISMEN, ARCLK, ECILC, MAVI, PETKM, TOASO, KRDMD]
  tubitak_95:
    groups: [Bankacilik, Sigorta_Araci_Kurum, Holding_Yatirim, Bilisim_Yazilim, Demir_Celik_Boru,
             Insaat_Yapi_Malzemeleri, GYO, Otomotiv_YanSanayi, Dayanikli_Tuketim, Enerji, Petrokimya_Endustri,
             Tarim_Gubre, Gida_Icecek, Perakende, Havacilik_Lojistik, Savunma_Makine, Telekomunikasyon, Saglik_Ilac]
