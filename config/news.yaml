# Topic -> phrases (Turkish lowercase, word-bounded prefixes allowed with a trailing *). Order = event_type priority.
topics:
  earnings: [bilanço*, "net kâr*", "net kar*", "net dönem kâr*", "finansal sonuç*", "çeyrek sonuç*", "kârını açıkla*", "karını açıkla*"]
  dividend: [temettü*, "kâr payı", "kar payı"]
  corporate_action: [bedelsiz, "sermaye artırım*", "pay bölünme*", "geri alım*"]
  contract: [sözleşme*, ihale*, "anlaşma imzala*", sipariş*]
  regulation: [spk, bddk, sedk, "rekabet kurulu", düzenleme*]
  rates: ["politika faiz*", ppk, "faiz karar*", "merkez bankası", tcmb, "faiz indirim*", "faiz artırım*"]
  inflation: [enflasyon*, tüfe, üfe]
  fx: [dolar*, "dolar/tl", "euro/tl", euro*, avro*, döviz*, kurlar*, "kur farkı", "kur şok*"]
  fed: [fed, fomc, powell]
  commodity: [petrol*, brent, "altın fiyat*", "ons altın", doğalgaz*, emtia*, çelik*]
  geopolitics: [savaş*, jeopolitik*, saldırı*, ateşkes*, yaptırım*]
  equity_market: ["borsa istanbul", "bist 100", bist100, "bıst 100", bıst100, borsa*]
