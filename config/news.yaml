  TURSG: {names: [türkiye sigorta], exclude: [türkiye sigorta birliği, türkiye sigorta piyasa*, türkiye sigorta sektör*]}
  ENJSA: {names: [enerjisa], exclude: [enerjisa üretim]}   # Enerjisa Üretim is not listed
