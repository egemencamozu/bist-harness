# News metadata tagging (CLAUDE.md §11): Bloomberg HT archive -> news_events (contextual evidence only).
#
# Matching is deterministic and runs on Turkish-lowercased text (İ->i, I->ı).
#   names: case-insensitive phrases (word-bounded)    exact: case-sensitive tokens (e.g. THY, BİM)
#   exclude: phrases blanked out before this ticker's names are matched ("türkiye sigorta birliği" is not TURSG)
#   code: false — the ticker code is an everyday word / other entity (DEVA = DEVA Partisi): never match the code
# Universe: all 96 tickers of config/universe.yaml (course 30 tagged since 2026-11-21, the other 66 since 2026-11-23).
# Ambiguous everyday words only in a longer form ("anadolu efes" not "efes" = Ephesus; "çelebi hava" not the
# surname; TAV only upper-case). Precision audit: reports/news_tagging_audit.md.
# A ticker is attached when an alias appears in the TITLE, or its code (e.g. THYAO) appears anywhere, or aliases
# appear at least `min_body_mentions` times in the body. Round-up/recap pages only keep title matches.
min_body_mentions: 2
# Market recaps list many codes in the body: when more than max_body_tickers tickers match only in the body, only
# title matches are kept (2026-11-21: daily "Piyasa özeti" pages matched 5-9 tickers each).
max_body_tickers: 4
roundup_title_patterns: ["gündemi", "gündem -", "piyasalarda gün", "günün özeti", "piyasa özeti", "canlı blog", "haftanın özeti"]

tickers:
  ASELS: {names: [aselsan]}
  TUPRS: {names: [tüpraş, tupras]}
  BIMAS: {names: [bim birleşik mağazalar], exact: [BİM]}
  THYAO: {names: [türk hava yolları, turkish airlines], exact: [THY]}
  AKBNK: {names: [akbank]}
  KCHOL: {names: [koç holding]}
  EREGL: {names: [ereğli demir, erdemir]}
  TCELL: {names: [turkcell]}
