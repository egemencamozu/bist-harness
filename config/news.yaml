  MGROS: {names: [migros]}
  SASA: {names: [sasa polyester], exact: [SASA]}
  TRALT: {names: [türk altın, koza altın]}
  FROTO: {names: [ford otosan, ford otomotiv]}
  ENKAI: {names: [enka inşaat], exact: [ENKA]}
  PGSUS: {names: [pegasus hava, pegasus]}
