[project]
name = "bistharness"
version = "0.1.0"
description = "Integrated BIST 100 Agentic Financial Analytics Harness (CSE-481) — offline, point-in-time, evidence-based"
readme = "CLAUDE.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
ingest = [
    "yfinance>=0.2.50",
    "duckdb>=1.0",
]
mcp = ["mcp[cli]>=1.2"]
llm = ["ollama>=0.4"]
ui = ["streamlit>=1.38", "plotly>=5.22"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bistharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "live: needs internet (skipped by default)",
    "data: needs the frozen local snapshot in data/ (skipped if missing)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["reference", ".tools", ".venv-train", "unsloth_compiled_cache"]  # instructor scripts (verbatim) + generated/third-party code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # Turkish text is intentional; long lines are left to the formatter

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
mypy_path = "src"
